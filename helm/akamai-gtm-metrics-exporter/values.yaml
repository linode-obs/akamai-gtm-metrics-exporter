replicaCount: 1

image:
  repository: ghcr.io/linode-obs/akamai-gtm-metrics-exporter
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 9800

config:
  summaryWindow: 2d
  prefillWindow: 30m
  timestampLabel: false
  trafficTimestamp: true
  domains: []
    # - domain_name: my.super.gtm.domain
    #   properties: # collect traffic data for these properties
    #     - property_name: "myprop"
    #       dc_nickname: # optionally filter on these dcs
    #         - mydc1
    #         - mydc2
    #   liveness_tests: # collect liveness test data for these properties
    #     - property_name: "myprop"
    #       target_ip: 1.2.3.4 # optionally filter on target ip or cname alias

logLevel: debug # one of: debug, info, warn, error, fatal

credentials:
  create: false
  existingSecret: ""
  existingSecretKeys:
    host: host
    clientToken: clientToken
    clientSecret: clientSecret
    accessToken: accessToken
  # Used only when credentials.create=true ; all must be supplied.
  secretData:
    host: ""
    clientToken: ""
    clientSecret: ""
    accessToken: ""

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

serviceMonitor:
  enabled: false
  interval: 60s
  scrapeTimeout: 10s
  labels: {}
  relabelings: []
    # - sourceLabels: [__meta_kubernetes_pod_node_name]
    #   separator: ;
    #   regex: ^(.*)$
    #   targetLabel: nodename
    #   replacement: $1
    #   action: replace
