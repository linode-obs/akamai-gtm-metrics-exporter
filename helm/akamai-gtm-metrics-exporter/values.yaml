replicaCount: 1

image:
  repository: ghcr.io/linode-obs/akamai-gtm-metrics-exporter
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 9800

config:
  summaryWindow: 2d
  prefillWindow: 30m
  timestampLabel: false
  trafficTimestamp: true
  domains: []
    # - domain_name: my.super.gtm.domain
    #   properties: # collect traffic data for these properties
    #     - property_name: "myprop"
    #       dc_nickname: # optionally filter on these dcs
    #         - mydc1
    #         - mydc2
    #   liveness_tests: # collect liveness test data for these properties
    #     - property_name: "myprop"
    #       target_ip: 1.2.3.4 # optionally filter on target ip or cname alias

logLevel: info # one of: debug, info, warn, error, fatal

edgegridSecret:
  create: false
  name: "akamai-gtm-metrics-exporter-credentials"
  # Update these *Ref values to match the keys in your secret if you are using an existing secret.
  clientTokenRef: "clientToken"
  clientSecretRef: "clientSecret"
  accessTokenRef: "accessToken"
  hostRef: "host"

  # Used only when edgegridSecret.create=true ; all must be supplied.
  host: ""
  clientToken: ""
  clientSecret: ""
  accessToken: ""

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

serviceMonitor:
  enabled: false
  interval: 60s
  scrapeTimeout: 10s
  labels: {}
  relabelings: []
    # - sourceLabels: [__meta_kubernetes_pod_node_name]
    #   separator: ;
    #   regex: ^(.*)$
    #   targetLabel: nodename
    #   replacement: $1
    #   action: replace
